# Test setup: podman compose up -d   (or docker compose up -d)
services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: linedata
      POSTGRES_USER: linedata
      POSTGRES_PASSWORD: change-me
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"

  grafana:
    image: docker.io/grafana/grafana-oss:latest
    depends_on: [db]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  db-data:
  grafana-data:
